# Bygger logiken och kör alla tester vid varje push och pull request.
# Windows-maskin eftersom testerna använder Windows PowerShell 5.1, Pester 3.4 och Microsoft Edge (finns förinstallerat).
name: Tester
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tester:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Pester 3.4 (följer med Windows, installeras bara om den saknas)
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Bygg logiken och kör alla tester
        run: .\run-tests.ps1

      - name: logic.js ska vara byggd från logic.ts
        run: |
          git diff --exit-code -- kundregister/logic.js
          if ($LASTEXITCODE -ne 0) { Write-Host "logic.js är inte byggd från aktuell logic.ts. Kör run-tests.ps1 lokalt och committa logic.js."; exit 1 }
