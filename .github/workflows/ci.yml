# Bygger logiken och kör alla tester vid varje push och pull request.
name: Tester
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: npm-paketen
        run: npm ci

      - name: Bygg logiken och kör alla tester
        run: npm test

      - name: logic.js ska vara byggd från logiken
        run: |
          git diff --exit-code -- kundregister/logic.js || { echo "logic.js är inte byggd från aktuell logik (kundregister/logic/). Kör npm test lokalt och committa logic.js."; exit 1; }
