# Builds the logic and runs all tests on every push and pull request.
name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: npm packages
        run: npm ci

      - name: Build the logic and run all tests
        run: npm test

      - name: logic.js must be built from the logic
        run: |
          git diff --exit-code -- crm/logic.js || { echo "logic.js is not built from the current logic (crm/logic/). Run npm test locally and commit logic.js."; exit 1; }
